<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe | Shared Family Recipes</title>
    <meta
      name="description"
      content="View and share an individual Shared Family Recipes recipe page."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="recipe.css" />
  </head>
  <body data-page="recipe">
    <div id="sharedNavbarMount"></div>

    <main class="recipe-shell">
      <div class="recipe-page-actions">
        <a class="btn btn-ghost" href="../index.html">Back To Recipes</a>
        <button id="copyRecipeLink" type="button" class="btn btn-secondary">Copy Share Link</button>
      </div>

      <section class="panel recipe-page-panel" id="recipePanel" hidden>
        <header class="recipe-head">
          <p id="recipeMealType" class="recipe-meal"></p>
          <h1 id="recipeTitle"></h1>
          <div class="recipe-byline" aria-label="Recipe author">
            <span id="recipeAuthorAvatar" class="profile-avatar recipe-author-avatar" aria-hidden="true"></span>
            <p id="recipeByline" class="recipe-byline-text"></p>
          </div>
          <p id="recipeDescription" class="recipe-description"></p>
          <div id="recipeTags" class="tags"></div>
        </header>

        <section class="rating-box" aria-label="Recipe rating">
          <p id="ratingSummary" class="rating-summary"></p>
          <p id="ratingMeta" class="rating-meta"></p>
          <div id="ratingInput" class="rating-input" aria-label="Rate this recipe"></div>
        </section>

        <div class="recipe-sections">
          <section class="recipe-section">
            <h2>Ingredients</h2>
            <ul id="ingredientsList" class="ingredients"></ul>
          </section>
          <section class="recipe-section">
            <h2>Steps</h2>
            <ol id="stepsList" class="steps"></ol>
          </section>
        </div>
      </section>

      <p id="recipeStatus" class="status"></p>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../supabase-config.js"></script>
    <script defer src="../shared/profile-utils.js"></script>
    <script defer src="../shared/auth-utils.js"></script>
    <script defer src="../shared/navbar.js"></script>
    <script defer src="recipe.js"></script>
  </body>
</html>
