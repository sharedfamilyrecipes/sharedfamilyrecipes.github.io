<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Shared Family Recipes</title>
    <meta
      name="description"
      content="Manage your Shared Family Recipes profile, avatar, and password settings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body data-page="profile">
    <div id="sharedNavbarMount"></div>

    <main class="profile-shell">
      <header class="profile-head">
        <div>
          <p class="eyebrow">Shared Family Recipes</p>
          <h1>Your Profile</h1>
          <p class="intro">Update how your account appears across the recipe board.</p>
        </div>
      </header>

      <section class="panel profile-summary-panel">
        <div class="profile-summary">
          <span id="profilePreviewAvatar" class="profile-avatar profile-avatar-large" aria-hidden="true"></span>
          <div>
            <p id="profileSummaryName" class="profile-summary-name">Profile</p>
            <p id="profileSummaryEmail" class="profile-summary-email"></p>
          </div>
        </div>
        <p id="profileGateMessage" class="status"></p>
      </section>

      <section class="profile-grid">
        <section class="panel">
          <h2>Public Profile</h2>
          <form id="profileForm" class="profile-form" novalidate>
            <label>
              Display Name
              <input id="displayName" name="displayName" type="text" maxlength="60" placeholder="How your name should appear" />
            </label>

            <label>
              Upload Photo
              <input id="avatarUpload" name="avatarUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
            </label>

            <div class="profile-actions">
              <button type="submit" class="btn btn-primary">Save Profile</button>
              <button type="button" id="useInitialsBtn" class="btn btn-ghost">Use Initials Only</button>
            </div>
            <p id="profileStatus" class="status"></p>
          </form>
        </section>

        <section class="panel">
          <h2>Password</h2>
          <form id="passwordForm" class="profile-form" novalidate>
            <label>
              New Password
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" />
            </label>
            <label>
              Confirm Password
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" />
            </label>
            <div class="profile-actions">
              <button type="submit" class="btn btn-primary">Change Password</button>
            </div>
            <p id="passwordStatus" class="status"></p>
          </form>
        </section>
      </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../supabase-config.js"></script>
    <script defer src="../shared/profile-utils.js"></script>
    <script defer src="../shared/auth-utils.js"></script>
    <script defer src="../shared/navbar.js"></script>
    <script defer src="profile.js"></script>
  </body>
</html>
